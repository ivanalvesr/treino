<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Treino Full Body 4x</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
/* ===================== TEMA ===================== */
:root{
  --bg:#0d0f12;
  --bg2:#14171c;
  --card:#1a1e25;
  --card2:#222833;
  --line:#333b47;
  --fg:#f4f7fa;          /* texto principal */
  --fg2:#cfd8e3;         /* texto secundário legível */
  --accent:#4da3ff;      /* primária */
  --amber:#ffc14d;       /* destaque "última carga" */
  --done:#2fc46b;        /* série concluída */
  --danger:#ff5d5d;
  --radius:12px;
  --tap:44px;            /* área mínima de toque */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:16px; line-height:1.4;
  padding-top:126px; padding-bottom:108px;
  -webkit-text-size-adjust:100%;
}
button,input{font-family:inherit;font-size:16px}

/* ===================== TOPO FIXO ===================== */
#topbar{
  position:fixed;top:0;left:0;right:0;z-index:40;
  background:var(--bg2);border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
#head{display:flex;align-items:center;justify-content:space-between;padding:8px 12px 4px}
#head .t{font-size:16px;font-weight:700;letter-spacing:.2px}
#head .d{font-size:14px;color:var(--fg2)}
#tabs{display:flex;gap:6px;padding:0 8px 8px}
.tab{
  flex:1 1 0;min-width:52px;min-height:var(--tap);
  background:var(--card);color:var(--fg);border:1px solid var(--line);
  border-radius:10px;font-weight:700;font-size:16px;cursor:pointer;
}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#06121f}
.tab.hist{flex:0 0 var(--tap);font-size:18px}
#progwrap{height:6px;background:#000}
#progfill{height:100%;width:0;background:var(--done);transition:width .15s linear}

/* ===================== CONTEÚDO ===================== */
main{padding:12px 10px 0}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:2px 2px 10px}
.sechead h1{font-size:20px;margin:0}
.sechead .sub{font-size:14px;color:var(--fg2);white-space:nowrap}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;overflow:hidden}
.card.full{border-color:var(--done)}
.chead{padding:10px 12px}
.cname{font-size:18px;font-weight:700;line-height:1.25}
.cmeta{margin-top:5px;display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:14px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--card2);color:var(--fg)}
.pill.grp{background:#27303d;color:var(--accent)}
.pill.rir{background:#3a2f16;color:var(--amber)}
.pill.opc{background:transparent;color:var(--fg2);border:1px dashed var(--fg2);font-weight:700;letter-spacing:.3px}
.pill.apa{background:#2b2536;color:#cbb6f0}   /* aparelho/estação */
/* orientação de progressão (texto de personal): dica por exercício e ciclo de 15 dias */
.ciclo{font-size:14px;color:var(--fg2);margin:-4px 2px 12px;line-height:1.35}
.dica{margin-top:8px;padding:8px 10px;border-radius:8px;font-size:14px;line-height:1.35;background:var(--card2);color:var(--fg2)}
.dica.subir{background:#3a2f16;color:var(--amber);font-weight:600}
.dica.inicio{color:var(--fg)}
/* exercício opcional: card com borda tracejada, título um tom abaixo */
.card.opc{border-style:dashed}
.card.opc .cname{color:var(--fg2)}
.card.opc.full{border-color:var(--done)}

/* ilustração */
.illu{
  display:flex;align-items:center;gap:10px;width:100%;
  background:transparent;border:0;border-top:1px solid var(--line);
  padding:8px 12px;min-height:var(--tap);cursor:pointer;color:var(--fg2);
  text-align:left;font-size:14px;
}
.illu svg{width:88px;height:88px;flex:0 0 88px;color:var(--fg2)}
.illu[data-open="1"]{flex-direction:column;align-items:center;gap:4px}
.illu[data-open="1"] svg{width:min(240px,70vw);height:min(240px,70vw);flex:0 0 auto;color:var(--fg)}

/* séries */
.sets{padding:4px 8px 10px}
.setrow{border-top:1px solid var(--line);padding:8px 4px 6px}
.setrow:first-child{border-top:0}
.setgrid{display:grid;grid-template-columns:var(--tap) 1fr 1fr;gap:8px;align-items:center}
.chk{
  min-width:var(--tap);min-height:var(--tap);border-radius:10px;
  background:var(--card2);border:2px solid var(--line);color:var(--fg);
  font-size:16px;font-weight:700;cursor:pointer;
}
.chk[aria-pressed="true"]{background:var(--done);border-color:var(--done);color:#04200f}
.fld{position:relative}
.fld input{
  width:100%;min-height:var(--tap);padding:0 36px 0 10px;
  background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:10px;
  font-size:17px;font-weight:600;
}
.fld input:focus{outline:2px solid var(--accent);outline-offset:1px}
.fld .u{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--fg2);pointer-events:none}
.last{margin:5px 0 0 calc(var(--tap) + 8px);font-size:14px;font-weight:600;color:var(--amber)}
.last.none{color:var(--fg2);font-weight:400}

/* ações */
.actions{display:flex;gap:8px;margin:14px 2px 20px}
.btn{
  flex:1;min-height:var(--tap);border-radius:10px;cursor:pointer;
  background:var(--card);color:var(--fg);border:1px solid var(--line);font-weight:700;
}
.btn.danger{color:var(--danger);border-color:#5a2a2a}

/* descanso / histórico */
.note{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.note h1{margin:0 0 6px;font-size:22px}
.note p{margin:0;color:var(--fg2);font-size:16px}
.pickgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick{min-height:56px;border-radius:10px;background:var(--card2);color:var(--fg);border:1px solid var(--line);font-size:16px;font-weight:700;cursor:pointer;padding:6px}
.hitem{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;overflow:hidden}
.hhead{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:var(--tap);padding:10px 12px;background:transparent;border:0;color:var(--fg);font-size:16px;font-weight:700;cursor:pointer;text-align:left}
.hhead .hs{font-size:14px;color:var(--fg2);font-weight:600}
.hbody{padding:0 12px 10px;display:none}
.hitem[data-open="1"] .hbody{display:block}
.hex{padding:7px 0;border-top:1px solid var(--line)}
.hex b{display:block;font-size:15px;font-weight:700}
.hex span{color:var(--amber);font-weight:600;font-size:15px}
.empty{color:var(--fg2);padding:20px 4px;font-size:16px}
/* relatório de progressão */
.seg{display:flex;gap:6px;margin:0 2px 14px}
.seg button{flex:1;min-height:var(--tap);border-radius:10px;background:var(--card);color:var(--fg2);border:1px solid var(--line);font-size:15px;font-weight:700;cursor:pointer}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#06121f}
.pgtopo{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 12px;margin:0 2px 14px;text-align:center}
.pgidx{font-size:40px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.pgidx.up{color:var(--done)} .pgidx.down{color:var(--danger)} .pgidx.flat{color:var(--fg2)}
.pgcap{font-size:14px;color:var(--fg2);margin-top:2px;line-height:1.35}
.pgnums{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:14px;color:var(--fg2)}
.pgnums b{color:var(--fg);font-size:17px}
.pgitem{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;margin:0 2px 8px}
.pgtop{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pgtop b{font-size:16px;line-height:1.25}
.pgdelta{font-size:16px;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.pgdelta.up{color:var(--done)} .pgdelta.down{color:var(--danger)} .pgdelta.flat{color:var(--fg2)}
.pgsub{font-size:14px;color:var(--fg2);margin-top:5px;line-height:1.5}
.pgseta{color:var(--fg)}
.pgparado{display:inline-block;margin-left:4px;color:var(--amber)}
.pgbar{height:5px;background:var(--bg);border-radius:3px;margin-top:8px;overflow:hidden}
.pgbar i{display:block;height:100%;border-radius:3px;background:var(--fg2)}
.pgbar i.up{background:var(--done)} .pgbar i.down{background:var(--danger)}
.pgnota{font-size:13px;color:var(--fg2);line-height:1.45;margin:14px 4px 4px}
.pgsec{font-size:14px;font-weight:700;color:var(--fg2);margin:18px 4px 8px;text-transform:uppercase;letter-spacing:.4px}
.pgitem.geral{border-color:var(--accent)}
.pgchart{width:100%;height:72px;display:block;margin-top:8px;overflow:visible}
.pgchart .linha{fill:none;stroke:var(--fg2);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.pgchart .zero{stroke:var(--line);stroke-width:1;stroke-dasharray:4 4;vector-effect:non-scaling-stroke}
.pgchart circle{fill:var(--fg2)}
.pgitem.up .pgchart .linha{stroke:var(--done)} .pgitem.up .pgchart circle{fill:var(--done)}
.pgitem.down .pgchart .linha{stroke:var(--danger)} .pgitem.down .pgchart circle{fill:var(--danger)}
.pgeixo{display:flex;justify-content:space-between;font-size:12px;color:var(--fg2);margin-top:2px}

/* cópia de segurança */
.backup{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px 10px 12px;margin:14px 2px 0}
.bkcap{font-size:14px;color:var(--fg2);margin-bottom:8px}
.restaurar{background:#1f3a2a;color:#c8f2d8;font-size:14px;padding:8px 12px;text-align:center;line-height:1.35}
.restaurar button{margin-left:8px;min-height:32px;padding:0 12px;border-radius:8px;background:var(--done);color:#04200f;border:0;font-weight:700;font-size:14px;cursor:pointer}

/* perfis (quem treina) */
#head .who{display:flex;align-items:center;gap:6px;min-height:var(--tap);max-width:62vw;margin:-8px 0 -6px -8px;padding:0 8px;background:transparent;border:0;color:var(--fg);font-size:17px;font-weight:700;cursor:pointer;text-align:left}
#head .who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.prow{display:flex;gap:8px}
.pbtn{flex:1;min-height:56px;border-radius:10px;background:var(--card);color:var(--fg);border:1px solid var(--line);font-size:18px;font-weight:700;cursor:pointer;text-align:left;padding:0 14px}
.prow.on .pbtn{border-color:var(--accent)}
.pon{font-size:13px;color:var(--accent);font-weight:600;margin-left:8px}
.pdel{flex:0 0 var(--tap);min-height:56px;border-radius:10px;background:var(--card);color:var(--danger);border:1px solid #5a2a2a;font-size:24px;cursor:pointer}
.pnew{display:flex;gap:8px}
.pnew input{flex:1;min-width:0;min-height:52px;padding:0 12px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:10px;font-size:17px}
.pnew input:focus{outline:2px solid var(--accent);outline-offset:1px}
.pnew .btn{flex:0 0 104px;background:var(--accent);color:#06121f;border-color:var(--accent)}
.ptag{display:inline-block;margin-left:6px;font-size:12px;font-weight:600;color:var(--fg2);background:var(--card2);padding:2px 7px;border-radius:999px;vertical-align:middle}
.pcap{font-size:14px;color:var(--fg2);margin:14px 2px 6px}
.pprog{display:flex;flex-wrap:wrap;gap:8px}
.pradio{display:flex;align-items:center;gap:8px;min-height:var(--tap);padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:15px;cursor:pointer}
.pradio input{width:20px;height:20px;accent-color:var(--accent);margin:0}
.pradio small{color:var(--fg2)}

/* ===================== TIMER FIXO ===================== */
#timerbar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:var(--bg2);border-top:1px solid var(--line);
  padding:8px 8px calc(8px + env(safe-area-inset-bottom));
}
#trow{display:flex;gap:6px;align-items:center}
#tclock{
  flex:0 0 86px;min-height:var(--tap);display:flex;align-items:center;justify-content:center;
  font-size:23px;font-weight:800;font-variant-numeric:tabular-nums;
  background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--fg2);
}
#tclock.run{color:var(--accent);border-color:var(--accent)}
#tclock.done{color:var(--done);border-color:var(--done)}
.tb{flex:1 1 0;min-width:0;min-height:var(--tap);border-radius:10px;background:var(--card);color:var(--fg);border:1px solid var(--line);font-weight:700;font-size:15px;cursor:pointer}
.tb.stop{flex:0 0 72px;background:#3a1f1f;color:var(--danger);border-color:#5a2a2a}
#tauto{display:flex;justify-content:center;margin-top:6px}
#tauto label{min-height:28px;display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;color:var(--fg2)}
#tauto input{width:20px;height:20px;accent-color:var(--accent)}
</style>
</head>

<!-- ===================== BIBLIOTECA DE ILUSTRAÇÕES =====================
     Um <symbol> por padrão de movimento, referenciado pelos cards com <use>.
     Convenções, iguais em todos os desenhos:
       - viewBox 0 0 200 200, chão/base em y=182
       - corpo com volume, todo em currentColor:
           cabeça  = círculo cheio r=11
           pescoço = linha 10
           tronco  = quadrilátero cheio (ombro mais largo que o quadril)
           coxa 15 · perna 13 · braço 9 · pé/mão 9, pontas arredondadas
       - equipamento SEMPRE em linha fina 4 sem preenchimento, para não
         competir com o corpo: barra = linha com dois retângulos nas pontas,
         banco/assento/trilho = linha, máquina = bloco simples, cabo = linha
       - primeiro grupo, opacidade 0.35 = posição inicial
         segundo grupo, opaco        = posição final
         a seta (linha 4) aponta sempre de "inicial" para "final"
       - ordem de desenho: equipamento, posição inicial, posição final
     Exercícios repetidos entre os dias reutilizam o mesmo símbolo (ver o
     mapa ILLU no script). ==================================================== -->

  "Supino reto com halteres":"halteres", "Abdominal máquina":"máquina"

/* ---------------------- utilidades ---------------------- */
var DIAS = ["domingo","segunda","terça","quarta","quinta","sexta","sábado"];
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function pad(n){ return n<10 ? "0"+n : ""+n; }
function isoDate(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function brDate(iso, full){ var p=iso.split("-"); return p[2]+"/"+p[1]+(full ? "/"+p[0] : ""); }
function plural(n, sing, plu){ return n+" "+(n===1 ? sing : plu); }
function wkById(id){ for(var i=0;i<WORKOUTS.length;i++){ if(WORKOUTS[i].id===id) return WORKOUTS[i]; } return null; }
function setsOf(wk, name){ for(var i=0;i<wk.ex.length;i++){ if(wk.ex[i][1]===name) return wk.ex[i][2]; } return 0; }

/* ---------------------- persistência ----------------------
   Os dados são separados por PERFIL (o nome de quem treina). Chaves:
     tw1:perfis                       lista JSON com os nomes
     tw1:perfil                       nome ativo no momento
     tw1:s:<nome>:AAAA-MM-DD:TREINO   uma sessão
   valor da sessão: { d:data, w:treino, t:timestamp,
            e:{ "Nome do exercício":[{l:carga, r:reps, c:feito}, ...] } }
   <nome> vai codificado (encodeURIComponent) para nunca conflitar com ":".
   Não há senha: é separação de dados, não sigilo.                         */
var PREFIX = "tw1:";

/* Acesso ao localStorage à prova de falha: em aba anônima, com storage
   bloqueado ou abrindo o arquivo por um caminho sem origem, o navegador
   lança erro. Nesses casos os dados ficam só em memória (perdidos ao
   fechar) e a página exibe um aviso, em vez de parar de funcionar. */
var LS = (function(){
  var ok = true, mem = {};
  try{ localStorage.setItem(PREFIX+"__t","1"); localStorage.removeItem(PREFIX+"__t"); }catch(e){ ok = false; }
  return {
    ok: ok,
    get:  function(k){ if(!ok) return (k in mem) ? mem[k] : null; try{ return localStorage.getItem(k); }catch(e){ return null; } },
    set:  function(k,v){ if(!ok){ mem[k]=v; return; } try{ localStorage.setItem(k,v); }catch(e){} },
    del:  function(k){ if(!ok){ delete mem[k]; return; } try{ localStorage.removeItem(k); }catch(e){} },
    keys: function(){ if(!ok) return Object.keys(mem); var a=[]; try{ for(var i=0;i<localStorage.length;i++) a.push(localStorage.key(i)); }catch(e){} return a; }
  };
})();

function perfilKey(nome){ return PREFIX+"s:"+encodeURIComponent(nome===undefined ? (state.perfil||"") : nome)+":"; }
function sKey(date,w){ return perfilKey()+date+":"+w; }
function loadSess(date,w){
  try{ var v = JSON.parse(LS.get(sKey(date,w))); return (v && v.e) ? v : null; }catch(e){ return null; }
}
function saveSess(s){ s.t = Date.now(); LS.set(sKey(s.d,s.w), JSON.stringify(s)); }
function allSess(){
  var out=[], ks = LS.keys(), pre = perfilKey();
  for(var i=0;i<ks.length;i++){
    var k=ks[i];
    if(!k || k.indexOf(pre)!==0) continue;
    try{ var v=JSON.parse(LS.get(k)); if(v && v.d && v.w && v.e) out.push(v); }catch(e){}
  }
  out.sort(function(a,b){ return a.d<b.d ? 1 : (a.d>b.d ? -1 : 0); });   /* mais recente primeiro */
  return out;
}
/* Última execução registrada daquele exercício, de outro dia.
   Procura primeiro no mesmo treino (A1 com A1) e, se não achar, em
   qualquer treino que tenha o mesmo exercício — útil quando um exercício
   aparece em mais de um dia do programa. */
function lastFor(w, exName, setIdx, skipDate){
  var list = allSess();
  function buscar(mesmoTreino){
    for(var i=0;i<list.length;i++){
      var s = list[i];
      if(s.d===skipDate) continue;
      if(mesmoTreino ? (s.w!==w) : (s.w===w)) continue;
      var arr = s.e[exName];
      if(!arr) continue;
      var e = arr[setIdx];
      if(e && (e.l || e.r)) return { l:e.l, r:e.r, d:s.d, w:s.w };
      for(var j=arr.length-1;j>=0;j--){        /* fallback: última série preenchida daquele dia */
        if(arr[j] && (arr[j].l || arr[j].r)) return { l:arr[j].l, r:arr[j].r, d:s.d, w:s.w, approx:true };
      }
    }
    return null;
  }
  return buscar(true) || buscar(false);
}

/* ---------------------- progressão sugerida ----------------------
   Regras de orientação para quem está começando (35 anos, sem histórico):
   - Início: carga que permita o TOPO da faixa de reps sobrando ~3 (RIR 3).
     Nas duas primeiras semanas a prioridade é técnica, não carga.
   - Manter a carga até bater o topo da faixa E completar 15 dias nela.
   - Aí subir: pernas +5 kg, peito/costas +2,5 kg, demais +2 kg, e voltar
     para a BASE da faixa de reps (progressão dupla, em ciclos de 15 dias).
   Tudo isso é sugestão em texto — a decisão continua sendo de quem treina. */
function faixaReps(txt){ var m = String(txt).match(/(\d+)\D+(\d+)/); return m ? { base:+m[1], topo:+m[2] } : null; }
function incremento(grp, nome){
  var g = String(grp).toLowerCase(), n = String(nome||"").toLowerCase();
  if(/halter/.test(n)) return 2;                       /* halteres sobem de 2 em 2 kg */
  if(/polia|cabo|abdutora/.test(n)) return 2.5;        /* isolamento em cabo/máquina */
  if(/quadr|poster|pantur|gl[uú]t/.test(g)) return 5;
  if(/peito|costas/.test(g)) return 2.5;
  return 2;
}
function fmtKg(n){ return String(Math.round(n*10)/10).replace(".", ","); }
function numKg(s){ var v = parseFloat(String(s).replace(",", ".")); return isNaN(v) ? null : v; }
function diasEntre(a, b){ return Math.round((new Date(b+"T00:00:00") - new Date(a+"T00:00:00")) / 86400000); }
function progressao(w, x, sessoes){
  var name = x[1], f = faixaReps(x[3]); if(!f) return null;
  var list = (sessoes || allSess()).filter(function(s){ return s.w===w && s.d!==state.date && s.e[name]; });
  function cargaDe(s){ var arr = s.e[name]; for(var i=0;i<arr.length;i++){ if(arr[i] && numKg(arr[i].l)!==null) return numKg(arr[i].l); } return null; }
  var ult = null;
  for(var i=0;i<list.length;i++){ if(cargaDe(list[i])!==null){ ult = list[i]; break; } }
  if(!ult) return { tipo:"inicio", txt:"Início: escolha uma carga que permita "+f.topo+" reps sobrando 3. Nas duas primeiras semanas, técnica antes de carga." };
  var L = cargaDe(ult), reps = 0;
  ult.e[name].forEach(function(k){ var r = k && parseInt(k.r,10); if(r > reps) reps = r; });
  var desde = ult.d;                                  /* sessões consecutivas na mesma carga */
  for(var j=0;j<list.length;j++){ var c = cargaDe(list[j]); if(c===null) continue; if(c===L) desde = list[j].d; else break; }
  var dias = diasEntre(desde, state.date), inc = incremento(x[0], x[1]);
  if(reps >= f.topo && dias >= 15) return { tipo:"subir",  txt:dias+" dias em "+fmtKg(L)+" kg batendo "+f.topo+" reps: suba para "+fmtKg(L+inc)+" kg e volte para "+f.base+" reps." };
  if(reps >= f.topo)               return { tipo:"manter", txt:"Você já faz "+f.topo+" reps com "+fmtKg(L)+" kg. Mantenha até completar 15 dias (faltam "+(15-dias)+"), depois suba para "+fmtKg(L+inc)+" kg." };
  return { tipo:"reps", txt:"Mantenha "+fmtKg(L)+" kg e busque chegar a "+f.topo+" reps (última: "+(reps || "—")+")." };
}
/* dia do programa e próxima revisão de cargas (ciclos de 15 dias) */
function cicloTxt(sessoes){
  var primeira = null;
  (sessoes || allSess()).forEach(function(s){ if(!primeira || s.d < primeira) primeira = s.d; });
  if(!primeira || primeira > state.date) return "Dia 1 do programa · anote carga e reps de cada série; a cada 15 dias eu sugiro o ajuste.";
  var dia = diasEntre(primeira, state.date) + 1, resto = (dia - 1) % 15, faltam = 15 - resto;
  if(resto === 0 && dia > 1) return "Dia "+dia+" do programa · hoje é dia de revisão de cargas — veja a dica em cada exercício.";
  return "Dia "+dia+" do programa · próxima revisão de cargas em "+faltam+" dia"+(faltam===1?"":"s")+".";
}

/* ---------------------- perfis ---------------------- */
function perfis(){ try{ var v = JSON.parse(LS.get(PREFIX+"perfis")); return Array.isArray(v) ? v : []; }catch(e){ return []; } }
function savePerfis(list){ LS.set(PREFIX+"perfis", JSON.stringify(list)); }
function normNome(n){ return String(n||"").replace(/\s+/g," ").trim().slice(0,30); }
/* cria (ou reaproveita, ignorando maiúsculas) e devolve o nome canônico */
function addPerfil(nome, prog){
  nome = normNome(nome); if(!nome) return null;
  var list = perfis(), igual = null;
  list.forEach(function(p){ if(p.toLowerCase()===nome.toLowerCase()) igual = p; });
  if(igual) return igual;
  if(!list.length) migrarLegado(nome);      /* primeiro perfil herda o que já estava gravado */
  setProg(nome, PROGRAMAS[prog] ? prog : PROGRAMA_PADRAO);
  list.push(nome); savePerfis(list);
  return nome;
}
function setPerfil(nome){ state.perfil = nome; LS.set(PREFIX+"perfil", nome); usarPrograma(progDe(nome)); }

/* programa de cada perfil (chave tw1:prog:<nome>) */
function progDe(nome){ return LS.get(PREFIX+"prog:"+encodeURIComponent(nome)) || PROGRAMA_PADRAO; }
function setProg(nome, key){ LS.set(PREFIX+"prog:"+encodeURIComponent(nome), key); }
function usarPrograma(key){
  if(!PROGRAMAS[key]) key = PROGRAMA_PADRAO;
  state.programa = key;
  WORKOUTS = PROGRAMAS[key].treinos || [];
  SCHEDULE = PROGRAMAS[key].dias || {};
}
function delPerfil(nome){
  var pre = perfilKey(nome);
  LS.keys().forEach(function(k){ if(k && k.indexOf(pre)===0) LS.del(k); });
  savePerfis(perfis().filter(function(p){ return p!==nome; }));
  if(state.perfil===nome){ state.perfil = null; LS.del(PREFIX+"perfil"); }
}
/* sessões gravadas antes de existirem perfis (tw1:AAAA-MM-DD:TREINO) */
function migrarLegado(nome){
  var pre = perfilKey(nome);
  LS.keys().forEach(function(k){
    if(!k || k.indexOf(PREFIX)!==0) return;
    var p = k.split(":");
    if(p.length!==3 || !/^\d{4}-\d{2}-\d{2}$/.test(p[1])) return;
    var v = LS.get(k); if(v){ LS.set(pre+p[1]+":"+p[2], v); LS.del(k); }
  });
}

/* ==================== PROTEÇÃO DOS DADOS ====================
   Regra do projeto: publicar versão nova NUNCA pode apagar treino.
   Como isso é garantido, e não só prometido:

   1. Deploy não encosta nos dados. O histórico vive no localStorage, que é
      um armazenamento separado do cache do service worker. Trocar o HTML
      publicado não mexe em nada gravado no aparelho.
   2. O formato das chaves é versionado (SCHEMA). Renomear chave só pode
      acontecer dentro de migrar(), e migrar() sempre tira uma cópia antes.
   3. Cópia automática em tw1:backup: refeita a cada 7 dias e antes de
      qualquer migração. Ela NUNCA é sobrescrita por um conjunto menor do
      que o que já guarda — se algo apagar os dados, a cópia sobrevive.
   4. Se o app abrir sem nenhuma sessão e houver cópia com sessões, aparece
      uma faixa oferecendo restaurar. Nada é restaurado sem você mandar.
   5. Exportar/importar arquivo na tela de histórico, para levar o
      histórico para outro aparelho ou guardar fora do navegador.
   O único jeito de perder dados continua sendo "limpar dados do site" no
   navegador — por isso o item 5 existe.                                    */
var SCHEMA = 2;   /* 1 = sessões sem perfil · 2 = sessões por perfil */

function chavesDados(){
  return LS.keys().filter(function(k){
    return k && k.indexOf(PREFIX)===0 && k !== PREFIX+"backup";
  });
}
function coletarDados(){
  var o = {};
  chavesDados().forEach(function(k){ var v = LS.get(k); if(v !== null) o[k] = v; });
  return o;
}
function contarSessoes(dados){
  return Object.keys(dados || {}).filter(function(k){ return k.indexOf(PREFIX+"s:")===0; }).length;
}
function lerBackup(){
  try{ var b = JSON.parse(LS.get(PREFIX+"backup")); return (b && b.dados) ? b : null; }catch(e){ return null; }
}
/* devolve false quando se recusa a sobrescrever uma cópia maior */
function fazerBackup(motivo){
  var atual = coletarDados(), b = lerBackup();
  if(b && contarSessoes(atual) < contarSessoes(b.dados)) return false;
  LS.set(PREFIX+"backup", JSON.stringify({ t:Date.now(), v:SCHEMA, motivo:motivo||"", dados:atual }));
  return true;
}
function restaurarBackup(){
  var b = lerBackup(); if(!b) return 0;
  var n = 0;
  Object.keys(b.dados).forEach(function(k){ LS.set(k, b.dados[k]); n++; });
  return n;
}
function migrarSchema(){
  var v = parseInt(LS.get(PREFIX+"schema"), 10);
  if(!v){
    var legado = chavesDados().some(function(k){ return /^tw1:\d{4}-\d{2}-\d{2}:/.test(k); });
    v = legado ? 1 : SCHEMA;
  }
  if(v !== SCHEMA){
    fazerBackup("antes de migrar do formato "+v+" para "+SCHEMA);
    /* 1 -> 2: sessões sem perfil são adotadas pelo primeiro perfil criado,
       o que migrarLegado() já faz. Nada a apagar aqui. */
  }
  LS.set(PREFIX+"schema", String(SCHEMA));
}
/* faixa de restauro quando os dados sumiram mas a cópia existe */
function ofereceRestauro(b){
  var el = document.createElement("div");
  el.className = "restaurar";
  el.innerHTML = 'Encontrei uma cópia com '+plural(contarSessoes(b.dados),"sessão","sessões")+
    ' de '+brDate(isoDate(new Date(b.t)),true)+'. <button id="btrest">Restaurar</button>';
  document.getElementById("topbar").appendChild(el);
  document.body.style.paddingTop = "170px";
  document.getElementById("btrest").addEventListener("click", function(){
    if(confirm("Restaurar a cópia de segurança? Os dados atuais do aparelho são substituídos pelos da cópia.")){
      restaurarBackup();
      location.reload();
    }
  });
}
function protegerDados(){
  migrarSchema();
  var b = lerBackup(), nAtual = contarSessoes(coletarDados());
  if(b && nAtual === 0 && contarSessoes(b.dados) > 0) return ofereceRestauro(b);
  if(!b || (Date.now() - (b.t||0)) > 7*86400000) fazerBackup("cópia periódica");
}

/* ---- exportar / importar arquivo ---- */
function exportarJSON(){
  var pacote = { app:"treino", v:SCHEMA, t:Date.now(), dados:coletarDados() };
  try{
    var blob = new Blob([JSON.stringify(pacote)], {type:"application/json"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "treino-" + isoDate(new Date()) + ".json";
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.parentNode.removeChild(a); }, 2000);
  }catch(e){ alert("Não consegui gerar o arquivo neste navegador."); }
}
/* importar UNE com o que já existe: sessão nova entra, sessão repetida só
   substitui se a do arquivo for mais recente. Nada é apagado. */
function importarJSON(texto){
  var obj;
  try{ obj = JSON.parse(texto); }catch(e){ alert("Arquivo inválido."); return; }
  if(!obj || !obj.dados){ alert("Este arquivo não é uma cópia do Treino."); return; }
  fazerBackup("antes de importar arquivo");
  var novas = 0, atualizadas = 0;
  Object.keys(obj.dados).forEach(function(k){
    if(k.indexOf(PREFIX)!==0 || k === PREFIX+"backup") return;
    if(k === PREFIX+"perfil" || k === PREFIX+"schema" || k === PREFIX+"auto") return;
    if(k === PREFIX+"perfis"){                        /* une as listas de nomes */
      try{
        var minha = perfis(), dele = JSON.parse(obj.dados[k]) || [];
        dele.forEach(function(p){
          if(!minha.some(function(q){ return q.toLowerCase()===String(p).toLowerCase(); })) minha.push(p);
        });
        savePerfis(minha);
      }catch(e){}
      return;
    }
    var atual = LS.get(k);
    if(atual === null){ LS.set(k, obj.dados[k]); novas++; return; }
    try{
      var a = JSON.parse(atual), d = JSON.parse(obj.dados[k]);
      if(a && d && (d.t||0) > (a.t||0)){ LS.set(k, obj.dados[k]); atualizadas++; }
    }catch(e){}
  });
  alert("Cópia restaurada.\n"+novas+" sessões novas, "+atualizadas+" atualizadas.\nNada foi apagado.");
  location.reload();
}

/* ---------------------- estado ---------------------- */
var state = { date: isoDate(new Date()), view: null, sess: null, perfil: null, programa: null, histAba: "sessoes" };

function ensureSess(w){
  var s = loadSess(state.date, w);
  return s ? s : { d:state.date, w:w, e:{} };
}
function entry(s, exName, sets, i){
  if(!s.e[exName]) s.e[exName] = [];
  var arr = s.e[exName];
  while(arr.length < sets) arr.push({l:"",r:"",c:false});
  if(!arr[i]) arr[i] = {l:"",r:"",c:false};
  return arr[i];
}

/* ---------------- ilustração ----------------
   Se existe um <symbol> para o exercício, usa <use>; senão, desenha o
   placeholder com o nome dentro (mesmo viewBox, mesmo tamanho na lista). */
function illuSVG(name){
  var id = ILLU[name];
  if(id && document.getElementById(id)){
    return '<svg viewBox="0 0 200 200" role="img" aria-label="'+esc(name)+'"><use href="#'+id+'"/></svg>';
  }
  return illuPlaceholder(name);
}

function wrapText(t, max){
  var words = String(t).split(" "), lines=[], cur="";
  for(var i=0;i<words.length;i++){
    var test = cur ? cur+" "+words[i] : words[i];
    if(test.length > max && cur){ lines.push(cur); cur = words[i]; } else { cur = test; }
  }
  if(cur) lines.push(cur);
  return lines.slice(0,4);
}
function illuPlaceholder(name){
  var lines = wrapText(name, 17);
  var y0 = 100 - (lines.length-1)*11;
  var tspans = lines.map(function(l,i){ return '<tspan x="100" y="'+(y0 + i*22)+'">'+esc(l)+'</tspan>'; }).join("");
  return '<svg viewBox="0 0 200 200" role="img" aria-label="'+esc(name)+'">'+
    '<title>'+esc(name)+'</title>'+
    '<rect x="6" y="6" width="188" height="188" rx="10" fill="none" stroke="currentColor" stroke-width="3" stroke-dasharray="8 6"/>'+
    '<text text-anchor="middle" font-size="17" font-weight="700" fill="currentColor" font-family="sans-serif">'+tspans+'</text>'+
    '</svg>';
}

function renderProgress(){
  var fill = document.getElementById("progfill");
  if(!state.sess){ fill.style.width = "0"; return; }
  /* exercícios opcionais (x[5]) não entram na conta: a sessão fecha 100%
     sem eles. As séries opcionais feitas aparecem à parte, como "+N". */
  var wk = wkById(state.view), total=0, done=0, extra=0;
  wk.ex.forEach(function(x){
    var arr = state.sess.e[x[1]] || [], feitas = 0;
    for(var i=0;i<x[2];i++){ if(arr[i] && arr[i].c) feitas++; }
    if(x[5]){ extra += feitas; } else { total += x[2]; done += feitas; }
  });
  fill.style.width = total ? Math.round(done/total*100)+"%" : "0";
  var sub = document.getElementById("sub");
  if(sub) sub.textContent = done+"/"+total+(total===1 ? " série" : " séries") + (extra ? " +"+extra : "");
}

function renderWorkout(id){
  state.view = id;
  state.sess = ensureSess(id);
  var wk = wkById(id), sessoes = allSess();
  var html = '<div class="sechead"><h1>'+esc(wk.nome)+' &middot; '+esc(wk.dia)+'</h1><div class="sub" id="sub"></div></div>'+
    '<div class="ciclo">'+esc(cicloTxt(sessoes))+'</div>';

  wk.ex.forEach(function(x){
    var grp=x[0], name=x[1], sets=x[2], reps=x[3], rir=x[4], opc=!!x[5];
    var faixa = faixaReps(reps), dica = progressao(id, x, sessoes);
    var arr = state.sess.e[name] || [];
    var allDone = true;
    for(var i=0;i<sets;i++){ if(!(arr[i] && arr[i].c)) allDone = false; }

    html += '<section class="card'+(allDone?' full':'')+(opc?' opc':'')+'" data-ex="'+esc(name)+'">'+
      '<div class="chead"><div class="cname">'+esc(name)+'</div><div class="cmeta">'+
        '<span class="pill grp">'+esc(grp)+'</span>'+
        '<span class="pill">'+sets+' &times; '+esc(reps)+'</span>'+
        '<span class="pill rir">RIR '+esc(rir)+'</span>'+
        (APARELHO[name] ? '<span class="pill apa">'+esc(APARELHO[name])+'</span>' : '')+
        (opc ? '<span class="pill opc">opcional</span>' : '')+
      '</div>'+
      (dica ? '<div class="dica '+dica.tipo+'">'+esc(dica.txt)+'</div>' : '')+
      '</div>'+
      '<button class="illu" data-open="0" data-illu="1" aria-expanded="false">'+
        illuSVG(name)+'<span class="cap">toque para ampliar</span>'+
      '</button><div class="sets">';

    for(var i=0;i<sets;i++){
      var e = arr[i] || {l:"",r:"",c:false};
      var last = lastFor(id, name, i, state.date);
      var lastTxt = last
        ? 'última: '+(last.l ? esc(last.l)+'kg' : '—')+' &times; '+(last.r ? esc(last.r) : '—')+
          ' <span style="opacity:.8;font-weight:400">('+brDate(last.d)+(last.approx ? ', outra série' : '')+')</span>'
        : 'sem registro anterior';
      html += '<div class="setrow"><div class="setgrid">'+
          '<button class="chk" data-chk="'+i+'" aria-pressed="'+(e.c?'true':'false')+'" aria-label="Série '+(i+1)+' de '+sets+'">'+(e.c?'&#10003;':(i+1))+'</button>'+
          '<div class="fld"><input type="text" inputmode="decimal" enterkeyhint="done" data-f="l" data-i="'+i+'" value="'+esc(e.l)+'" placeholder="carga" aria-label="Carga da série '+(i+1)+'"><span class="u">kg</span></div>'+
          '<div class="fld"><input type="text" inputmode="decimal" enterkeyhint="done" data-f="r" data-i="'+i+'" value="'+esc(e.r)+'" placeholder="'+(faixa ? faixa.topo : 'reps')+'" aria-label="Reps da série '+(i+1)+(faixa ? ', sugestão '+faixa.topo : '')+'"><span class="u">rep</span></div>'+
        '</div><div class="last'+(last?'':' none')+'">'+lastTxt+'</div></div>';
    }
    html += '</div></section>';
  });

  html += '<div class="actions"><button class="btn danger" id="reset">Zerar sessão de hoje</button></div>';
  viewEl.innerHTML = html;
  renderTabs();
  renderProgress();
  window.scrollTo(0,0);
}

function renderRest(){
  state.view = "REST"; state.sess = null;

    '<div class="note"><h1>Descanso / cardio</h1><p>Hoje é '+DIAS[d.getDay()]+'. Não há treino de força programado.</p></div>'+
    '<div class="note"><p style="margin-bottom:10px">Quer treinar mesmo assim?</p><div class="pickgrid">'+

      }).join("")+
    '</div></div>';

/* ==================== RELATÓRIO DE PROGRESSÃO ====================
   A métrica central é o 1RM estimado (fórmula de Epley: carga × (1 + reps/30)),
   porque ela junta carga e repetições num número só: subir de 60kg×9 para
   60kg×11 é progresso, e olhar só a carga não veria isso.
   Para exercício sem carga (peso do corpo), o índice usa as repetições.
   É estimativa para comparar você com você mesmo ao longo do tempo — não
   serve para dizer quanto você levanta de verdade numa tentativa máxima.  */
function e1rm(l, r){
  var L = numKg(l), R = parseInt(r, 10);
  if(L === null || !R) return null;
  return L * (1 + R/30);
}
function relatorio(){
  var list = allSess().slice().sort(function(a,b){ return a.d < b.d ? -1 : (a.d > b.d ? 1 : 0); });
  var porEx = {}, series = 0, volume = 0, datas = [];
  list.forEach(function(s){
    if(datas.indexOf(s.d) < 0) datas.push(s.d);
    Object.keys(s.e).forEach(function(nome){
      var melhor = null, vol = 0, maxReps = 0;
      s.e[nome].forEach(function(k){
        if(!k) return;
        if(k.c) series++;
        var L = numKg(k.l), R = parseInt(k.r, 10);
        if(R) maxReps = Math.max(maxReps, R);
        if(L !== null && R){
          vol += L * R;
          var e = e1rm(k.l, k.r);
          if(e !== null && (!melhor || e > melhor.e)) melhor = { e:e, l:L, r:R };
        }
      });
      volume += vol;
      if(!melhor && !maxReps) return;
      (porEx[nome] = porEx[nome] || []).push({ d:s.d, melhor:melhor, reps:maxReps });
    });
  });

  var itens = [];
  Object.keys(porEx).forEach(function(nome){
    var h = porEx[nome];
    var comCarga = h.filter(function(x){ return x.melhor; });
    var base = comCarga.length ? comCarga : h, tipo = comCarga.length ? "carga" : "reps";
    if(base.length < 2) { itens.push({ nome:nome, sessoes:base.length, novo:true, ult:base[base.length-1], tipo:tipo }); return; }
    var pri = base[0], ult = base[base.length-1];
    var vPri = tipo === "carga" ? pri.melhor.e : pri.reps;
    var vUlt = tipo === "carga" ? ult.melhor.e : ult.reps;
    var delta = vPri > 0 ? (vUlt - vPri) / vPri * 100 : 0;
    /* parado: melhor marca não é das duas últimas sessões */
    var topo = 0, idxTopo = 0;
    base.forEach(function(x, i){ var v = tipo === "carga" ? x.melhor.e : x.reps; if(v > topo){ topo = v; idxTopo = i; } });
    var paradoHa = base.length - 1 - idxTopo;
    itens.push({ nome:nome, sessoes:base.length, tipo:tipo, delta:delta, pri:pri, ult:ult, paradoHa:paradoHa });
  });
  itens.sort(function(a,b){
    if(a.novo !== b.novo) return a.novo ? 1 : -1;
    return (b.delta||0) - (a.delta||0);
  });
  var comDelta = itens.filter(function(i){ return !i.novo; });
  var indice = comDelta.length ? comDelta.reduce(function(s,i){ return s + i.delta; }, 0) / comDelta.length : null;
  var semanas = datas.length > 1 ? Math.max(1, Math.round(diasEntre(datas[0], datas[datas.length-1]) / 7)) : 0;
  return { itens:itens, indice:indice, sessoes:datas.length, series:series, volume:volume,
           de:datas[0], ate:datas[datas.length-1], semanas:semanas, medidos:comDelta.length };
}
/* grupamento de um exercício: procura primeiro no programa ativo, depois em
   qualquer programa — assim exercício que saiu do treino continua classificado */
function grupoDe(nome){
  var chaves = [state.programa].concat(Object.keys(PROGRAMAS));
  for(var i=0;i<chaves.length;i++){
    var p = PROGRAMAS[chaves[i]]; if(!p) continue;
    for(var j=0;j<p.treinos.length;j++){
      var ex = p.treinos[j].ex;
      for(var k=0;k<ex.length;k++) if(ex[k][1] === nome) return ex[k][0];
    }
  }
  return "Outros";
}
/* linha do tempo do índice por grupamento: em cada data de treino, a marca
   mais recente de cada exercício é comparada com a primeira dele, e o grupo
   recebe a média dos seus exercícios. Exercício não treinado naquele dia
   mantém a última marca, então a linha não oscila à toa. */
function evolucaoPorGrupo(){
  var list = allSess().slice().sort(function(a,b){ return a.d < b.d ? -1 : (a.d > b.d ? 1 : 0); });
  var estado = {}, linha = [];
  list.forEach(function(s){
    Object.keys(s.e).forEach(function(nome){
      var melhor = null, maxReps = 0;
      s.e[nome].forEach(function(k){
        if(!k) return;
        var R = parseInt(k.r, 10); if(R) maxReps = Math.max(maxReps, R);
        var e = e1rm(k.l, k.r);
        if(e !== null && (melhor === null || e > melhor)) melhor = e;
      });
      var v = melhor !== null ? melhor : (maxReps || null);
      if(v === null) return;
      if(!estado[nome]) estado[nome] = { base:v, atual:v };
      else estado[nome].atual = v;
    });
    var acc = {};
    Object.keys(estado).forEach(function(nome){
      var st = estado[nome], g = grupoDe(nome);
      (acc[g] = acc[g] || []).push(st.base > 0 ? (st.atual - st.base)/st.base*100 : 0);
    });
    var foto = {};
    Object.keys(acc).forEach(function(g){
      foto[g] = acc[g].reduce(function(a,b){ return a+b; }, 0) / acc[g].length;
    });
    var todos = Object.keys(foto).map(function(g){ return foto[g]; });
    foto["Geral"] = todos.length ? todos.reduce(function(a,b){ return a+b; },0)/todos.length : 0;
    if(linha.length && linha[linha.length-1].d === s.d) linha[linha.length-1].g = foto;
    else linha.push({ d:s.d, g:foto });
  });
  return linha;
}
/* mini-gráfico de linha, SVG inline: eixo do tempo em dias, zero tracejado */
function grafico(pontos){
  if(pontos.length < 2) return "";
  var W = 320, H = 72, ML = 4, MR = 4, MT = 9, MB = 9;
  var x0 = pontos[0].x, xn = pontos[pontos.length-1].x, span = Math.max(1, xn - x0);
  var vals = pontos.map(function(p){ return p.y; }).concat([0]);
  var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
  if(max - min < 5) max = min + 5;
  var px = function(x){ return Math.round((ML + (x - x0)/span*(W - ML - MR))*10)/10; };
  var py = function(y){ return Math.round((MT + (max - y)/(max - min)*(H - MT - MB))*10)/10; };
  var pts = pontos.map(function(p){ return px(p.x)+","+py(p.y); }).join(" ");
  return '<svg class="pgchart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-hidden="true">'+
    '<line class="zero" x1="'+ML+'" y1="'+py(0)+'" x2="'+(W-MR)+'" y2="'+py(0)+'"/>'+
    '<polyline class="linha" points="'+pts+'"/>'+
    pontos.map(function(p){ return '<circle cx="'+px(p.x)+'" cy="'+py(p.y)+'" r="3"/>'; }).join("")+
  '</svg>';
}

function fmtDelta(d){ return (d >= 0 ? "+" : "") + (Math.round(d*10)/10).toString().replace(".", ",") + "%"; }
function classeDelta(d){ return d >= 2 ? "up" : (d <= -2 ? "down" : "flat"); }

function renderProgresso(){
  var r = relatorio();
  var html = '<div class="sechead"><h1>Progressão</h1><div class="sub">'+plural(r.sessoes,"sessão","sessões")+'</div></div>'+abaHist();
  if(!r.sessoes){
    html += '<div class="empty">Ainda não há treino registrado. Anote carga e repetições por algumas semanas e o relatório aparece aqui.</div>';
    viewEl.innerHTML = html; renderTabs(); renderProgress(); window.scrollTo(0,0); return;
  }
  html += '<div class="pgtopo">'+
    '<div class="pgidx '+(r.indice === null ? "flat" : classeDelta(r.indice))+'">'+
      (r.indice === null ? "—" : fmtDelta(r.indice))+'</div>'+
    '<div class="pgcap">'+(r.indice === null
      ? "Faltam duas execuções do mesmo exercício para calcular o índice."
      : "índice de progressão &middot; média de "+plural(r.medidos,"exercício","exercícios")+
        (r.semanas ? " em "+plural(r.semanas,"semana","semanas") : ""))+'</div>'+
    '<div class="pgnums">'+
      '<span><b>'+r.sessoes+'</b> sessões</span>'+
      '<span><b>'+r.series+'</b> séries</span>'+
      '<span><b>'+(Math.round(r.volume/100)/10).toString().replace(".", ",")+'</b> t levantadas</span>'+
    '</div></div>';

  /* ---- gráficos de evolução por grupamento ---- */
  var linha = evolucaoPorGrupo();
  if(linha.length >= 2){
    var grupos = {};
    linha.forEach(function(p){ Object.keys(p.g).forEach(function(g){ grupos[g] = true; }); });
    var ordem = Object.keys(grupos).sort(function(a,b){
      if(a === "Geral") return -1; if(b === "Geral") return 1;
      var ua = linha[linha.length-1].g[a] || 0, ub = linha[linha.length-1].g[b] || 0;
      return ub - ua;
    });
    html += '<div class="pgsec">Evolução no tempo</div>';
    ordem.forEach(function(g){
      var pontos = [];
      linha.forEach(function(p){
        if(p.g[g] === undefined) return;
        pontos.push({ x: diasEntre(linha[0].d, p.d), y: p.g[g] });
      });
      if(pontos.length < 2) return;
      var atual = pontos[pontos.length-1].y;
      html += '<div class="pgitem '+(g === "Geral" ? "geral " : "")+classeDelta(atual)+'">'+
        '<div class="pgtop"><b>'+esc(g)+'</b><span class="pgdelta '+classeDelta(atual)+'">'+fmtDelta(atual)+'</span></div>'+
        grafico(pontos)+
        '<div class="pgeixo"><span>'+brDate(linha[0].d)+'</span><span>'+brDate(linha[linha.length-1].d)+'</span></div>'+
      '</div>';
    });
    html += '<div class="pgsec">Por exercício</div>';
  }

  var maxAbs = 1;
  r.itens.forEach(function(i){ if(!i.novo) maxAbs = Math.max(maxAbs, Math.abs(i.delta)); });
  r.itens.forEach(function(i){
    var apa = APARELHO[i.nome] ? '<span class="pill apa">'+esc(APARELHO[i.nome])+'</span>' : '';
    if(i.novo){
      html += '<div class="pgitem"><div class="pgtop"><b>'+esc(i.nome)+'</b><span class="pgdelta flat">1ª vez</span></div>'+
        '<div class="pgsub">'+apa+' registrado em '+brDate(i.ult.d,true)+' &middot; precisa de outra execução para medir</div></div>';
      return;
    }
    function marca(x){
      return i.tipo === "carga" ? fmtKg(x.melhor.l)+"kg × "+x.melhor.r : x.reps+" reps";
    }
    var aviso = i.paradoHa >= 2 ? '<span class="pgparado">sem recorde há '+i.paradoHa+' sessões</span>' : '';
    html += '<div class="pgitem">'+
      '<div class="pgtop"><b>'+esc(i.nome)+'</b><span class="pgdelta '+classeDelta(i.delta)+'">'+fmtDelta(i.delta)+'</span></div>'+
      '<div class="pgsub">'+apa+' '+marca(i.pri)+' <span class="pgseta">→</span> '+marca(i.ult)+
        ' &middot; '+plural(i.sessoes,"sessão","sessões")+' '+aviso+'</div>'+
      '<div class="pgbar"><i class="'+classeDelta(i.delta)+'" style="width:'+Math.round(Math.abs(i.delta)/maxAbs*100)+'%"></i></div>'+
    '</div>';
  });
  html += '<div class="pgnota">O índice usa 1RM estimado (carga × (1 + reps ÷ 30)), que junta carga e repetições. '+
          'Serve para comparar você com você mesmo — não é teste de força máxima.</div>';
  viewEl.innerHTML = html;
  renderTabs(); renderProgress();
  window.scrollTo(0,0);
}
function abaHist(){
  return '<div class="seg">'+
    '<button data-hab="sessoes" class="'+(state.histAba !== "progresso" ? "on" : "")+'">Sessões</button>'+
    '<button data-hab="progresso" class="'+(state.histAba === "progresso" ? "on" : "")+'">Progressão</button></div>';
}

function renderHist(){
  state.view = "HIST"; state.sess = null;
  if(state.histAba === "progresso") return renderProgresso();
  var list = allSess().filter(function(s){
    var any = false;
    for(var k in s.e){ s.e[k].forEach(function(e){ if(e && (e.l||e.r||e.c)) any = true; }); }
    return any;
  });
  var html = '<div class="sechead"><h1>Histórico</h1><div class="sub">'+plural(list.length,"sessão","sessões")+'</div></div>'+abaHist();
  if(!list.length){
    html += '<div class="empty">Nenhuma sessão registrada ainda.</div>';
  } else {
    list.forEach(function(s, si){
      var nsets = 0;
      for(var k in s.e){ s.e[k].forEach(function(e){ if(e && e.c) nsets++; }); }
      var wk = wkById(s.w);
      var order = wk ? wk.ex.map(function(x){ return x[1]; }) : [];
      Object.keys(s.e).forEach(function(k){ if(order.indexOf(k) < 0) order.push(k); });
      html += '<div class="hitem" data-open="0"><button class="hhead" data-h="1">'+
        '<span>'+brDate(s.d,true)+' &middot; '+esc(s.w)+'</span><span class="hs">'+plural(nsets,"série","séries")+' &#9662;</span>'+
      '</button><div class="hbody">';
      order.forEach(function(name){
        var arr = s.e[name]; if(!arr) return;
        var parts = [];
        arr.forEach(function(e){ if(e && (e.l||e.r)) parts.push((e.l||'—')+'kg × '+(e.r||'—')); });
        if(!parts.length) return;
        html += '<div class="hex"><b>'+esc(name)+'</b><span>'+esc(parts.join("   ·   "))+'</span></div>';
      });
      html += '</div></div>';
    });
  }
  var bk = lerBackup();
  html += '<div class="backup">'+
      '<div class="bkcap">Cópia de segurança'+(bk ? ' &middot; automática em '+brDate(isoDate(new Date(bk.t)),true) : '')+'</div>'+
      '<div class="actions" style="margin:0">'+
        '<button class="btn" id="exportar">Salvar em arquivo</button>'+
        '<button class="btn" id="importar">Restaurar de arquivo</button>'+
      '</div>'+
      '<input type="file" id="arqimp" accept="application/json,.json" style="display:none">'+
    '</div>';
  html += '<div class="actions"><button class="btn danger" id="wipe">Apagar todo o histórico</button></div>';
  viewEl.innerHTML = html;
  renderTabs(); renderProgress();
  window.scrollTo(0,0);
}

function renderPerfil(){
  state.view = "PERFIL"; state.sess = null;
  var list = perfis();
  var html = '<div class="note"><h1>Quem vai treinar?</h1><p>Cada nome guarda as próprias cargas e o próprio histórico, neste aparelho. Não tem senha.</p></div>';
  if(list.length){
    html += '<div class="plist">' + list.map(function(p){
      var ativo = p === state.perfil;
      var pr = PROGRAMAS[progDe(p)] || PROGRAMAS[PROGRAMA_PADRAO];
      return '<div class="prow'+(ativo?' on':'')+'">'+
        '<button class="pbtn" data-perfil="'+esc(p)+'">'+esc(p)+' <span class="ptag">'+esc(pr.nome)+'</span>'+(ativo ? ' <span class="pon">ativo</span>' : '')+'</button>'+
        '<button class="pdel" data-delperfil="'+esc(p)+'" aria-label="Remover '+esc(p)+'">&times;</button></div>';
    }).join("") + '</div>';
  }
  html += '<form class="pnew" id="pnew" autocomplete="off">'+
    '<input type="text" id="pnome" maxlength="30" placeholder="'+(list.length ? 'Outro nome' : 'Seu nome')+'" autocapitalize="words" aria-label="Nome">'+
    '<button type="submit" class="btn">Entrar</button></form>'+
    '<div class="pcap">Programa do novo nome:</div>'+
    '<div class="pprog" role="radiogroup" aria-label="Programa">' + Object.keys(PROGRAMAS).map(function(k){
      var pr = PROGRAMAS[k];
      return '<label class="pradio"><input type="radio" name="prog" value="'+esc(k)+'"'+(k===PROGRAMA_PADRAO ? ' checked' : '')+'> '+
        esc(pr.nome)+(pr.treinos && pr.treinos.length ? '' : ' <small>(a montar)</small>')+'</label>';
    }).join("") + '</div>';
  viewEl.innerHTML = html;
  renderTabs(); renderProgress();
  window.scrollTo(0,0);
  if(!list.length){ var inp = document.getElementById("pnome"); if(inp) inp.focus(); }
}
/* entra com um nome (novo ou existente) e abre o treino do dia */
function entrar(nome, prog){
  var n = addPerfil(nome, prog); if(!n) return;
  setPerfil(n);
  if(!WORKOUTS.length) return renderVazio();
  var w = SCHEDULE[new Date().getDay()];
  if(w && wkById(w)) renderWorkout(w); else renderRest();
}
document.addEventListener("submit", function(ev){
  if(ev.target.id !== "pnew") return;
  ev.preventDefault();
  var sel = document.querySelector('input[name="prog"]:checked');
  entrar(document.getElementById("pnome").value, sel ? sel.value : PROGRAMA_PADRAO);
});
/* programa escolhido ainda sem treinos montados */
function renderVazio(){
  state.view = "VAZIO"; state.sess = null;
  var pr = PROGRAMAS[state.programa] || {nome:state.programa};
  viewEl.innerHTML = '<div class="note"><h1>'+esc(pr.nome)+'</h1>'+
    '<p>Este programa ainda não tem treinos. Monte-o no bloco <b>PROGRAMAS</b> do index.html, no mesmo formato do programa Masculino. Enquanto isso, toque no nome no topo para trocar de pessoa.</p></div>';
  renderTabs(); renderProgress();
  window.scrollTo(0,0);
}

function go(id){
  if(id === "PERFIL" || !state.perfil) return renderPerfil();   /* sem perfil não há onde gravar */
  if(!WORKOUTS.length) return renderVazio();
  if(id === "HIST") return renderHist();
  if(id === "REST") return renderRest();
  renderWorkout(id);
}

/* ---------------------- eventos ---------------------- */
document.addEventListener("click", function(ev){
  var t = ev.target.closest("[data-go],[data-chk],[data-illu],[data-h],[data-perfil],[data-delperfil],[data-hab],#reset,#wipe,#exportar,#importar");
  if(!t) return;

  if(t.hasAttribute("data-hab")){ state.histAba = t.getAttribute("data-hab"); return renderHist(); }

  if(t.id === "exportar") return exportarJSON();
  if(t.id === "importar"){
    var inp = document.getElementById("arqimp");
    inp.onchange = function(){
      var f = inp.files && inp.files[0];
      if(f){ var fr = new FileReader(); fr.onload = function(){ importarJSON(fr.result); }; fr.readAsText(f); }
    };
    inp.click();
    return;
  }

  if(t.hasAttribute("data-go")) return go(t.getAttribute("data-go"));

  if(t.hasAttribute("data-perfil")) return entrar(t.getAttribute("data-perfil"));

  if(t.hasAttribute("data-delperfil")){
    var nm = t.getAttribute("data-delperfil");
    if(confirm('Remover "'+nm+'" e TODO o histórico dessa pessoa?\nIsso não pode ser desfeito.')){
      delPerfil(nm); renderPerfil();
    }
    return;
  }

  if(t.hasAttribute("data-illu")){
    var open = t.getAttribute("data-open") === "1" ? "0" : "1";
    t.setAttribute("data-open", open);
    t.setAttribute("aria-expanded", open === "1" ? "true" : "false");
    t.querySelector(".cap").textContent = open === "1" ? "toque para recolher" : "toque para ampliar";
    return;
  }

  if(t.hasAttribute("data-h")){
    var box = t.parentNode;
    box.setAttribute("data-open", box.getAttribute("data-open") === "1" ? "0" : "1");
    return;
  }

  if(t.id === "reset"){
    if(confirm("Zerar todos os dados da sessão de hoje (" + state.view + ")?\nO histórico de outros dias não é afetado.")){
      LS.del(sKey(state.date, state.view));
      renderWorkout(state.view);
    }
    return;
  }

  if(t.id === "wipe"){
    if(confirm('Apagar TODO o histórico de "'+state.perfil+'"?\nOs outros nomes não são afetados. Isso não pode ser desfeito.')){
      var pre = perfilKey();
      LS.keys().forEach(function(k){ if(k && k.indexOf(pre)===0) LS.del(k); });
      renderHist();
    }
    return;
  }

  if(t.hasAttribute("data-chk")){
    var card = t.closest(".card"), name = card.getAttribute("data-ex");
    var sets = setsOf(wkById(state.view), name);
    var i = +t.getAttribute("data-chk");
    var e = entry(state.sess, name, sets, i);
    e.c = !e.c;
    saveSess(state.sess);
    t.setAttribute("aria-pressed", e.c ? "true" : "false");
    t.innerHTML = e.c ? "&#10003;" : (i+1);
    var arr = state.sess.e[name], all = true;
    for(var j=0;j<sets;j++){ if(!(arr[j] && arr[j].c)) all = false; }
    card.classList.toggle("full", all);
    renderProgress();
    if(e.c && document.getElementById("autochk").checked) startTimer(lastPreset);
    return;
  }
});

/* campos de carga / reps */
var saveTid = null;

/* Copia o valor da 1ª série para as demais do mesmo exercício.
   Só preenche série vazia ou que ainda esteja com a cópia automática
   (data-auto="1"); o que você digitou à mão nunca é sobrescrito.
   Corrigir a 1ª série atualiza as cópias que você não editou. */
function copiarPrimeira(card, campo){
  if(!card || !state.sess) return;
  var name = card.getAttribute("data-ex");
  var sets = setsOf(wkById(state.view), name);
  var origem = card.querySelector('input[data-f="'+campo+'"][data-i="0"]');
  if(!origem) return;
  var v = origem.value.trim();
  if(!v) return;
  var mudou = false;
  for(var i=1;i<sets;i++){
    var alvo = card.querySelector('input[data-f="'+campo+'"][data-i="'+i+'"]');
    if(!alvo) continue;
    if(alvo.value.trim() && alvo.getAttribute("data-auto") !== "1") continue;  /* digitado à mão: respeita */
    if(alvo.value === v) continue;
    alvo.value = v;
    alvo.setAttribute("data-auto", "1");
    entry(state.sess, name, sets, i)[campo] = v;
    mudou = true;
  }
  if(mudou) saveSess(state.sess);
}

document.addEventListener("input", function(ev){
  var el = ev.target;
  if(!el.getAttribute || !el.hasAttribute("data-f") || !state.sess) return;
  el.setAttribute("data-auto", "0");            /* digitou: passa a valer como manual */
  var name = el.closest(".card").getAttribute("data-ex");
  var sets = setsOf(wkById(state.view), name);
  var e = entry(state.sess, name, sets, +el.getAttribute("data-i"));
  e[el.getAttribute("data-f")] = el.value.trim();
  clearTimeout(saveTid);
  saveTid = setTimeout(function(){ saveSess(state.sess); }, 250);
});
document.addEventListener("change", function(ev){
  var el = ev.target;
  if(!el.hasAttribute || !el.hasAttribute("data-f") || !state.sess) return;
  saveSess(state.sess);
  if(el.getAttribute("data-i") === "0") copiarPrimeira(el.closest(".card"), el.getAttribute("data-f"));
});
/* Enter fecha o teclado */
document.addEventListener("keydown", function(ev){
  if(ev.key === "Enter" && ev.target.hasAttribute && ev.target.hasAttribute("data-f")) ev.target.blur();
});

/* ---------------------- timer de descanso ---------------------- */
var tEnd = 0, tTick = null, lastPreset = 90, audioCtx = null;
var clockEl = document.getElementById("tclock");
var stopBtn = document.getElementById("tstop");

function fmt(sec){ sec = Math.max(0, sec); return pad(Math.floor(sec/60))+":"+pad(sec%60); }
function paintTimer(){
  var left = Math.ceil((tEnd - Date.now())/1000);
  if(left <= 0){ finishTimer(); return; }
  clockEl.textContent = fmt(left);
}
function startTimer(sec){
  lastPreset = sec;
  tEnd = Date.now() + sec*1000;
  clockEl.className = "run";
  clockEl.textContent = fmt(sec);
  stopBtn.hidden = false;
  clearInterval(tTick);
  tTick = setInterval(paintTimer, 200);
  unlockAudio();
}
function stopTimer(){
  clearInterval(tTick); tTick = null; tEnd = 0;
  clockEl.className = ""; clockEl.textContent = "--:--";
  stopBtn.hidden = true;
}
function finishTimer(){
  clearInterval(tTick); tTick = null;
  clockEl.className = "done"; clockEl.textContent = "00:00";
  stopBtn.hidden = true;
  beep(); vibrate();
  setTimeout(function(){ if(!tTick){ clockEl.className = ""; clockEl.textContent = "--:--"; } }, 6000);
}
function unlockAudio(){
  try{
    if(!audioCtx && window.AudioContext) audioCtx = new AudioContext();
    if(audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  }catch(e){}
}
function beep(){
  try{
    unlockAudio();
    if(!audioCtx) return;
    [0, 0.35, 0.70].forEach(function(off){
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = "square"; o.frequency.value = 880;
      var t0 = audioCtx.currentTime + off;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.35, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.24);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t0); o.stop(t0 + 0.26);
    });
  }catch(e){}
}
function vibrate(){ try{ if(navigator.vibrate) navigator.vibrate([250,120,250,120,450]); }catch(e){} }

document.getElementById("trow").addEventListener("click", function(ev){
  var b = ev.target.closest("button"); if(!b) return;
  if(b.id === "tstop") return stopTimer();
  if(b.hasAttribute("data-sec")) startTimer(+b.getAttribute("data-sec"));
});
/* corrige a contagem ao voltar do bloqueio de tela */
document.addEventListener("visibilitychange", function(){ if(!document.hidden && tTick) paintTimer(); });

/* preferência do auto-descanso */
var autoChk = document.getElementById("autochk");
autoChk.checked = LS.get(PREFIX+"auto") !== "0";
autoChk.addEventListener("change", function(){ LS.set(PREFIX+"auto", autoChk.checked ? "1" : "0"); });

/* ---------------------- app instalável (PWA) ----------------------
   O service worker (sw.js) guarda a página em cache: o Android passa a
   oferecer "Instalar app" e o treino abre sem internet. Só roda em http(s);
   abrindo o arquivo local ele é ignorado. */
if("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
  /* Quando um service worker novo assume o controle, a página recarrega uma
     única vez para já mostrar a versão publicada, em vez de esperar a próxima
     abertura do app. O trinco evita qualquer laço de recarga. */
  var recarregou = false;
  navigator.serviceWorker.addEventListener("controllerchange", function(){
    if(recarregou) return;
    recarregou = true;
    location.reload();
  });
}

  if(w && wkById(w)) renderWorkout(w); else renderRest();
})();
</script>
