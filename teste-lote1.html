<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teste de ilustrações</title>
<style>
:root{--bg:#0d0f12;--card:#1a1e25;--line:#333b47;--fg:#f4f7fa;--fg2:#cfd8e3;--accent:#4da3ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding:16px}
h1{font-size:20px;margin:0 0 4px}
p.hint{color:var(--fg2);font-size:14px;margin:0 0 18px}
h2{font-size:15px;color:var(--fg2);font-weight:600;margin:26px 0 10px;border-bottom:1px solid var(--line);padding-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.cell{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.cell svg{width:100%;height:auto;aspect-ratio:1;color:var(--fg)}
.cell .nm{font-size:14px;font-weight:700;margin-top:6px}
.thumbs{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start}
.thumb{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;width:104px;text-align:center}
.thumb svg{width:72px;height:72px;color:var(--fg2)}
.thumb .nm{font-size:11px;color:var(--fg2);margin-top:4px;line-height:1.2}
.light{background:#f4f7fa;color:#12161c}
.light .cell{background:#fff;border-color:#c9d2dd}
.light .cell svg{color:#12161c}
</style>
</head>
<body>
<h1>Lote 1 — boneco com volume</h1>
<p class="hint">Mesma biblioteca que está no index.html. Em cima, tamanho ampliado (como no card expandido); embaixo, 72px (miniatura do card).</p>
<svg id="illu-lib" width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">

<symbol id="ex-hack-squat" viewBox="0 0 200 200">
  <title>Hack squat</title>
  <g fill="currentColor" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <!-- máquina: encosto inclinado + plataforma dos pés -->
    <g fill="none" stroke-width="4">
      <line x1="58" y1="78" x2="118" y2="182"/>
      <line x1="106" y1="176" x2="178" y2="176"/>
    </g>
    <!-- posição inicial: pernas estendidas -->
    <g opacity="0.35">
      <circle cx="61" cy="63" r="11"/>
      <line x1="63" y1="69" x2="69" y2="76" stroke-width="10"/>
      <path d="M58 82 L80 70 L99 107 L81 117 Z" stroke-width="5"/>
      <line x1="90" y1="112" x2="136" y2="124" stroke-width="15"/>
      <line x1="136" y1="124" x2="148" y2="170" stroke-width="13"/>
      <line x1="69" y1="76" x2="84" y2="86" stroke-width="9"/>
      <line x1="84" y1="86" x2="96" y2="78" stroke-width="9"/>
      <rect x="-12" y="-5" width="24" height="10" rx="4" transform="translate(71 74) rotate(-30)"/>
    </g>
    <!-- posição final: agachado -->
    <circle cx="83" cy="101" r="11"/>
    <line x1="85" y1="107" x2="91" y2="114" stroke-width="10"/>
    <path d="M80 120 L102 108 L121 145 L103 155 Z" stroke-width="5"/>
    <line x1="112" y1="150" x2="151" y2="122" stroke-width="15"/>
    <line x1="151" y1="122" x2="148" y2="170" stroke-width="13"/>
    <line x1="140" y1="174" x2="162" y2="174" stroke-width="9"/>
    <line x1="91" y1="114" x2="106" y2="124" stroke-width="9"/>
    <line x1="106" y1="124" x2="118" y2="116" stroke-width="9"/>
    <rect x="-12" y="-5" width="24" height="10" rx="4" transform="translate(93 112) rotate(-30)"/>
    <!-- seta: descida -->
    <g fill="none" stroke-width="4">
      <path d="M150 44 Q178 56 182 92"/>
      <path d="M172 84 L184 96 L190 80"/>
    </g>
  </g>
</symbol>

<symbol id="ex-agacho-smith" viewBox="0 0 200 200">
  <title>Agachamento no Smith</title>
  <g fill="currentColor" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <!-- guias verticais + base -->
    <g fill="none" stroke-width="4">
      <line x1="52" y1="18" x2="52" y2="184"/>
      <line x1="148" y1="18" x2="148" y2="184"/>
      <line x1="34" y1="184" x2="166" y2="184"/>
    </g>
    <!-- posição inicial: em pé -->
    <g opacity="0.35">
      <circle cx="96" cy="30" r="11"/>
      <line x1="96" y1="38" x2="96" y2="48" stroke-width="10"/>
      <path d="M83 46 L109 46 L106 88 L86 88 Z" stroke-width="5"/>
      <line x1="96" y1="88" x2="104" y2="130" stroke-width="15"/>
      <line x1="104" y1="130" x2="108" y2="174" stroke-width="13"/>
      <line x1="100" y1="178" x2="124" y2="178" stroke-width="9"/>
      <line x1="94" y1="52" x2="84" y2="62" stroke-width="9"/>
      <line x1="84" y1="62" x2="76" y2="50" stroke-width="9"/>
      <line x1="70" y1="46" x2="122" y2="46" stroke-width="6" fill="none"/>
      <rect x="64" y="34" width="10" height="24" rx="3"/>
      <rect x="118" y="34" width="10" height="24" rx="3"/>
    </g>
    <!-- posição final: agachado -->
    <circle cx="99" cy="78" r="11"/>
    <line x1="98" y1="86" x2="96" y2="95" stroke-width="10"/>
    <path d="M84 90 L108 98 L96 133 L76 127 Z" stroke-width="5"/>
    <line x1="86" y1="130" x2="130" y2="140" stroke-width="15"/>
    <line x1="130" y1="140" x2="108" y2="174" stroke-width="13"/>
    <line x1="100" y1="178" x2="124" y2="178" stroke-width="9"/>
    <line x1="94" y1="100" x2="84" y2="108" stroke-width="9"/>
    <line x1="84" y1="108" x2="76" y2="98" stroke-width="9"/>
    <line x1="70" y1="94" x2="122" y2="94" stroke-width="6" fill="none"/>
    <rect x="64" y="82" width="10" height="24" rx="3"/>
    <rect x="118" y="82" width="10" height="24" rx="3"/>
    <!-- seta: descida -->
    <g fill="none" stroke-width="4">
      <path d="M166 62 Q182 92 166 122"/>
      <path d="M158 112 L166 124 L174 114"/>
    </g>
  </g>
</symbol>

<symbol id="ex-leg-press" viewBox="0 0 200 200">
  <title>Leg press</title>
  <g fill="currentColor" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <!-- encosto, assento e trilho do carro -->
    <g fill="none" stroke-width="4">
      <line x1="62" y1="152" x2="22" y2="118"/>
      <line x1="52" y1="154" x2="100" y2="154"/>
      <line x1="112" y1="140" x2="194" y2="92"/>
    </g>
    <!-- tronco e cabeça (fixos) -->
    <circle cx="22" cy="101" r="11"/>
    <line x1="27" y1="105" x2="35" y2="113" stroke-width="10"/>
    <path d="M26 122 L42 102 L76 132 L64 148 Z" stroke-width="5"/>
    <line x1="36" y1="114" x2="48" y2="130" stroke-width="9"/>
    <line x1="48" y1="130" x2="60" y2="140" stroke-width="9"/>
    <!-- posição inicial: joelhos flexionados -->
    <g opacity="0.35">
      <line x1="70" y1="140" x2="76" y2="92" stroke-width="15"/>
      <line x1="76" y1="92" x2="118" y2="116" stroke-width="13"/>
      <rect x="-5" y="-18" width="10" height="36" rx="3" transform="translate(120 118) rotate(-31)"/>
    </g>
    <!-- posição final: pernas estendidas -->
    <line x1="70" y1="140" x2="112" y2="116" stroke-width="15"/>
    <line x1="112" y1="116" x2="152" y2="92" stroke-width="13"/>
    <line x1="152" y1="92" x2="161" y2="81" stroke-width="9"/>
    <rect x="-5" y="-18" width="10" height="36" rx="3" transform="translate(156 96) rotate(-31)"/>
    <!-- seta: empurrar -->
    <g fill="none" stroke-width="4">
      <path d="M112 62 Q146 40 174 42"/>
      <path d="M164 34 L176 42 L164 52"/>
    </g>
  </g>
</symbol>

<symbol id="ex-extensora" viewBox="0 0 200 200">
  <title>Cadeira extensora</title>
  <g fill="currentColor" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <!-- cadeira: encosto, assento, coluna e base -->
    <g fill="none" stroke-width="4">
      <line x1="44" y1="136" x2="32" y2="90"/>
      <line x1="44" y1="136" x2="104" y2="136"/>
      <line x1="104" y1="136" x2="104" y2="178"/>
      <line x1="28" y1="182" x2="164" y2="182"/>
    </g>
    <!-- tronco, cabeça e coxa (fixos) -->
    <circle cx="65" cy="66" r="11"/>
    <line x1="64" y1="74" x2="62" y2="85" stroke-width="10"/>
    <path d="M49 82 L75 86 L66 124 L46 120 Z" stroke-width="5"/>
    <line x1="56" y1="122" x2="104" y2="124" stroke-width="15"/>
    <line x1="64" y1="88" x2="76" y2="104" stroke-width="9"/>
    <line x1="76" y1="104" x2="86" y2="118" stroke-width="9"/>
    <!-- posição inicial: perna pendente -->
    <g opacity="0.35">
      <line x1="104" y1="124" x2="110" y2="170" stroke-width="13"/>
      <line x1="110" y1="170" x2="124" y2="174" stroke-width="9"/>
      <rect x="94" y="163" width="32" height="12" rx="5"/>
    </g>
    <!-- posição final: perna estendida -->
    <line x1="104" y1="124" x2="150" y2="120" stroke-width="13"/>
    <line x1="150" y1="120" x2="160" y2="108" stroke-width="9"/>
    <rect x="143" y="105" width="12" height="32" rx="5"/>
    <!-- seta: extensão -->
    <g fill="none" stroke-width="4">
      <path d="M128 172 Q154 164 160 138"/>
      <path d="M152 140 L160 128 L168 140"/>
    </g>
  </g>
</symbol>
</svg>
<h2>Ampliado</h2>
<div class="grid" id="big"></div>
<h2>Miniatura 72px — o que aparece na lista</h2>
<div class="thumbs" id="small"></div>
<h2>Conferência em fundo claro (herança de currentColor)</h2>
<div class="grid light" id="lightg" style="padding:12px;border-radius:12px"></div>
<script>
var syms = [].slice.call(document.querySelectorAll('#illu-lib symbol'));
function cell(s, cls, tag){
  var t = s.querySelector('title');
  return '<div class="'+cls+'"><svg viewBox="0 0 200 200" role="img" aria-label="'+(t?t.textContent:s.id)+'"><use href="#'+s.id+'"/></svg>'+
         '<div class="nm">'+(t?t.textContent:s.id)+'</div></div>';
}
document.getElementById('big').innerHTML    = syms.map(function(s){ return cell(s,'cell'); }).join('');
document.getElementById('small').innerHTML  = syms.map(function(s){ return cell(s,'thumb'); }).join('');
document.getElementById('lightg').innerHTML = syms.map(function(s){ return cell(s,'cell'); }).join('');
document.title = syms.length + ' ilustrações';
</script>
</body>
</html>
